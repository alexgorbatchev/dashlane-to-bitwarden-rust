[package]
name = "dashlane-to-bitwarden"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Convert local Dashlane CSV exports to Bitwarden JSON"

[dependencies]
anyhow = "1.0.102"
cli-command-kit = { git = "https://github.com/alexgorbatchev/cli-command-kit-rust.git", rev = "dead4a60e08c7a84bc77ef329b220bfecd57627b" }
csv = "1.4.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tempfile = "3.27.0"
uuid = { version = "1.26.1", features = ["v4", "serde"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
